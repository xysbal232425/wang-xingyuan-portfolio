name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify the ten films
        run: |
          set -euo pipefail
          mkdir _site
          cp *.html *.css *.js .nojekyll _site/
          cp -R assets _site/
          for dir in .film-parts/*; do
            cat "$dir"/part-* > "_site/assets/films/$(basename "$dir")"
          done
          cd _site
          sha256sum --check ../.github/media.sha256
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
